name: Build check
# Builds the Mac app on every push, so a change that doesn't compile is caught
# before the app's updater picks it up.
on:
  push:
    paths: ["mac/**", ".github/workflows/build.yml"]
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # Keep Swift's build folder between runs, so only changed files are recompiled.
      - uses: actions/cache@v4
        with:
          path: mac/.build
          key: swift-build-${{ runner.os }}-${{ hashFiles('mac/Package.swift') }}-${{ github.sha }}
          restore-keys: |
            swift-build-${{ runner.os }}-${{ hashFiles('mac/Package.swift') }}-
      - name: Build
        working-directory: mac
        run: |
          set -o pipefail
          swift build -c release 2>&1 | grep -vE "^\[[0-9]+/[0-9]+\]" | tail -150
      - name: Test the coach's decisions
        working-directory: mac
        run: |
          set -o pipefail
          swift test --filter CoachCoreTests 2>&1 | tee test.log | tail -40; status=${PIPESTATUS[0]}; (grep -iE -B1 -A3 "error|fail|issue" test.log | grep -v " passed" | head -60) || true; exit $status
