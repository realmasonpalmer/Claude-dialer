name: Clarity Dialer
# Builds and tests the new dialer (dialer/) on a Mac. Separate from the Live Coach build.
on:
  push:
    paths: ["dialer/**", ".github/workflows/dialer.yml"]
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build
        working-directory: dialer
        run: swift build -c release 2>&1 | grep -vE "^\[[0-9]+/[0-9]+\]" | tail -80; exit ${PIPESTATUS[0]}
      - name: Test
        working-directory: dialer
        run: swift test 2>&1 | tail -60; exit ${PIPESTATUS[0]}
